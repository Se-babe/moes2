<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>NWSC Jinja e-Participation — Report, Track & Engage</title>
    <meta name="description" content="Report water and sewer problems, track your requests with a reference number, get service updates, and take part in consultations with the National Water and Sewerage Corporation, Jinja Area." />
    <meta name="theme-color" content="#0A4D8C" />
    <meta name="application-name" content="NWSC e-Participation" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NWSC Jinja e-Participation" />
    <meta property="og:description" content="Report water and sewer problems, track requests and get official service updates from NWSC Jinja." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #F5F8FB;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Visible keyboard focus for accessibility */
      :focus-visible {
        outline: 3px solid #38BDF8;
        outline-offset: 2px;
      }
      /* Inter everywhere. Icons set their icon font inline, which still wins. */
      #root [dir="auto"],
      #root input,
      #root textarea {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      input:focus, textarea:focus {
        outline: none;
      }
      /* Shown instantly while the app script downloads; React replaces it. */
      #boot {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #0A4D8C; font: 600 15px 'Inter', system-ui, sans-serif;
      }
      #boot .drop {
        width: 44px; height: 44px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
        background: #0A4D8C; animation: boot-pulse 1.1s ease-in-out infinite;
      }
      #boot small { font-weight: 400; color: #475569; }
      @keyframes boot-pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { #boot .drop { animation: none; } }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use NWSC e-Participation. For help call toll-free 0800-200-977.
    </noscript>
    <div id="root"><div id="boot" role="status" aria-live="polite"><div class="drop"></div><div>NWSC Jinja e-Participation</div><small>Loading…</small></div></div>
  </body>
</html>
